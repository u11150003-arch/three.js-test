<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Winter Blues // 3D Jewel Case</title>
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #040813; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .header-bar {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .badge {
      background: rgba(10, 25, 55, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(80, 150, 255, 0.3); border-radius: 999px;
      padding: 6px 14px; font-size: 11px; letter-spacing: 0.08em; font-weight: 700; color: #7cb3ff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center; width: 92%; max-width: 440px;
    }
    .btn {
      background: rgba(13, 28, 60, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(100, 180, 255, 0.35); border-radius: 999px;
      color: #e2edff; font-size: 12px; font-weight: 600; padding: 9px 16px;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:active, .btn.active {
      background: #2563eb; color: #ffffff; border-color: #60a5fa;
      transform: scale(0.96); box-shadow: 0 0 16px rgba(59, 130, 246, 0.7);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="header-bar">
    <div class="badge">✦ WINTER BLUES // B-DAY ARCHIVE</div>
    <div class="badge">單指拖曳 • 雙指縮放</div>
  </div>

  <div class="controls">
    <button class="btn" id="btnToggleCover">📂 關閉 CD 盒</button>
    <button class="btn" id="btnPlay">▶ 播放旋轉</button>
    <button class="btn" id="btnEject">⏏ 取出光碟</button>
    <button class="btn" id="btnAutoSpin">🔄 360° 展示</button>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060c18);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.0;
    controls.maxDistance = 10.0;
    controls.target.set(0, 0, 0);

    // 光源設置
    const ambient = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambient);

    const dirLight1 = new THREE.DirectionalLight(0xdbeafe, 2.2);
    dirLight1.position.set(4, 6, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 1.6);
    dirLight2.position.set(-5, -2, -3);
    scene.add(dirLight2);

    const pointLight = new THREE.PointLight(0x60a5fa, 2.5, 8);
    pointLight.position.set(0, 1.5, 2);
    scene.add(pointLight);

    // 壓克力材質
    const acrylicMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.92,
      opacity: 1,
      transparent: true,
      roughness: 0.08,
      ior: 1.51,
      reflectivity: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.08
    });

    const spineMat = new THREE.MeshPhysicalMaterial({
      color: 0x93c5fd,
      transmission: 0.85,
      transparent: true,
      roughness: 0.2
    });

    // 動態生成「Winter Blues」封面 Texture
    function createCoverCanvas() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');

      // 背景漸層
      const grad = ctx.createRadialGradient(450, 420, 50, 512, 512, 600);
      grad.addColorStop(0, '#3b82f6');
      grad.addColorStop(0.35, '#1d4ed8');
      grad.addColorStop(0.7, '#07122b');
      grad.addColorStop(1, '#020612');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      // 動態藍光拉絲弧形 (Motion Streak)
      ctx.save();
      for (let i = 0; i < 28; i++) {
        ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 - i * 0.003})`;
        ctx.lineWidth = 14 + i * 2;
        ctx.beginPath();
        ctx.arc(360 + i * 12, 450, 220 + i * 8, -Math.PI * 0.35, Math.PI * 0.35);
        ctx.stroke();
      }
      ctx.restore();

      // 人物頭部輪廓剪影
      ctx.save();
      ctx.fillStyle = 'rgba(2, 6, 18, 0.88)';
      ctx.beginPath();
      ctx.ellipse(360, 430, 140, 180, -0.1, 0, Math.PI * 2);
      ctx.fill();

      // 面部高光輪廓
      const faceGrad = ctx.createRadialGradient(380, 410, 10, 380, 410, 70);
      faceGrad.addColorStop(0, '#e0f2fe');
      faceGrad.addColorStop(0.5, '#7dd3fc');
      faceGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = faceGrad;
      ctx.beginPath();
      ctx.ellipse(380, 415, 65, 80, -0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 文字排版
      ctx.textAlign = 'right';
      ctx.fillStyle = '#bae6fd';
      ctx.font = '300 36px sans-serif';
      ctx.letterSpacing = '5px';
      ctx.fillText('WINTER', 920, 100);
      ctx.font = '300 24px sans-serif';
      ctx.fillText('B - day   PARTY', 920, 145);

      // 手寫感草寫體
      ctx.fillStyle = '#67e8f9';
      ctx.font = 'italic 400 92px "Brush Script MT", "Segoe Script", cursive, sans-serif';
      ctx.fillText('Winter', 880, 780);
      ctx.fillText('Blues', 910, 870);

      // 底片噪點
      for (let j = 0; j < 3500; j++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.15)';
        ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
      }
      return cv;
    }

    // 封底 (Back Tray Inlay)
    function createBackCanvas() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#061026';
      ctx.fillRect(0, 0, 1024, 1024);

      // 側邊藍條裝飾
      ctx.fillStyle = '#1e40af';
      ctx.fillRect(0, 0, 90, 1024);
      ctx.fillRect(1024 - 90, 0, 90, 1024);

      // 曲目表
      ctx.fillStyle = '#93c5fd';
      ctx.font = '700 32px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('WINTER BLUES // TRACKLIST', 140, 140);
      ctx.fillRect(140, 160, 740, 2);

      const tracks = [
        "01. SUBZERO INTRO ............ 01:24",
        "02. WINTER BLUES ............. 03:42",
        "03. MIDNIGHT GLOW ............ 03:15",
        "04. FROZEN VAPOR ............. 02:58",
        "05. CONSTELLATION ............ 04:12",
        "06. DEEP BLUE NOCTURNE ....... 03:36",
        "07. AURA (OUTRO) ............. 02:05"
      ];
      ctx.font = '400 24px monospace';
      ctx.fillStyle = '#bfdbfe';
      tracks.forEach((t, i) => {
        ctx.fillText(t, 140, 240 + i * 55);
      });

      // 底部條碼
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(140, 830, 280, 70);
      for (let k = 150; k < 410; k += 8) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(k, 835, Math.random() > 0.4 ? 4 : 2, 60);
      }
      ctx.fillStyle = '#60a5fa';
      ctx.font = '400 16px monospace';
      ctx.fillText('COMPACT DISC DIGITAL AUDIO // ARCHIVE 2026', 140, 940);
      return cv;
    }

    // CD 光碟圓盤 Texture
    function createDiscCanvas() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');

      const cx = 512, cy = 512;
      // 藍調放射彩虹光
      const conic = ctx.createConicGradient(0, cx, cy);
      conic.addColorStop(0.0, '#0f172a');
      conic.addColorStop(0.2, '#1e3a8a');
      conic.addColorStop(0.35, '#0284c7');
      conic.addColorStop(0.5, '#38bdf8');
      conic.addColorStop(0.65, '#6366f1');
      conic.addColorStop(0.85, '#1e40af');
      conic.addColorStop(1.0, '#0f172a');
      ctx.fillStyle = conic;
      ctx.fillRect(0, 0, 1024, 1024);

      // 細緻同心圓微音軌
      ctx.lineWidth = 1;
      for (let r = 180; r < 490; r += 4) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.04 + (r % 8 === 0 ? 0.08 : 0)})`;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 唱片印刷文字
      ctx.fillStyle = '#bae6fd';
      ctx.font = 'italic 700 48px "Brush Script MT", cursive, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Winter Blues', cx, cy - 230);
      ctx.font = '500 16px sans-serif';
      ctx.letterSpacing = '4px';
      ctx.fillText('COMPACT DISC DIGITAL AUDIO', cx, cy + 260);
      return cv;
    }

    const coverTex = new THREE.CanvasTexture(createCoverCanvas());
    const backTex = new THREE.CanvasTexture(createBackCanvas());
    const discTex = new THREE.CanvasTexture(createDiscCanvas());

    // 主群組
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    // 1. 底盤 (Back Case & Tray)
    const backCaseGroup = new THREE.Group();
    mainGroup.add(backCaseGroup);

    // 外透明後殼
    const backShellGeo = new THREE.BoxGeometry(2.84, 2.5, 0.08);
    const backShell = new THREE.Mesh(backShellGeo, acrylicMat);
    backShell.position.set(0, 0, -0.06);
    backCaseGroup.add(backShell);

    // 封底印刷襯紙 (Back Inlay)
    const backPaperGeo = new THREE.PlaneGeometry(2.78, 2.44);
    const backPaperMat = new THREE.MeshStandardMaterial({
      map: backTex,
      roughness: 0.6,
      metalness: 0.1
    });
    const backPaper = new THREE.Mesh(backPaperGeo, backPaperMat);
    backPaper.position.set(0, 0, -0.019);
    backCaseGroup.add(backPaper);

    // 內層托盤基座 (Clear Tray)
    const trayGeo = new THREE.BoxGeometry(2.76, 2.42, 0.05);
    const tray = new THREE.Mesh(trayGeo, acrylicMat);
    tray.position.set(0, 0, 0.015);
    backCaseGroup.add(tray);

    // 正中央固定爪榫 (Rosette Hub) - 8 個卡爪
    const hubCenter = new THREE.Group();
    hubCenter.position.set(0, 0, 0.045);
    backCaseGroup.add(hubCenter);

    const hubCoreGeo = new THREE.CylinderGeometry(0.12, 0.13, 0.06, 32);
    const hubCore = new THREE.Mesh(hubCoreGeo, spineMat);
    hubCore.rotation.x = Math.PI / 2;
    hubCenter.add(hubCore);

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const toothGeo = new THREE.BoxGeometry(0.04, 0.08, 0.08);
      const tooth = new THREE.Mesh(toothGeo, spineMat);
      tooth.position.set(Math.cos(angle) * 0.15, Math.sin(angle) * 0.15, 0.01);
      tooth.rotation.z = angle;
      hubCenter.add(tooth);
    }

    // 2. CD 光碟片 (精準中空比例：RingGeometry 內圈真空孔 0.18，外圈 1.18)
    const discGroup = new THREE.Group();
    discGroup.position.set(0, 0, 0.07);
    backCaseGroup.add(discGroup);

    // 印刷有軌區 (中空環形)
    const discGeo = new THREE.RingGeometry(0.24, 1.18, 64);
    const discMat = new THREE.MeshStandardMaterial({
      map: discTex,
      roughness: 0.15,
      metalness: 0.85,
      side: THREE.DoubleSide
    });
    const discMesh = new THREE.Mesh(discGeo, discMat);
    discGroup.add(discMesh);

    // 中心透明夾層圈 (半徑 0.12 ~ 0.24，保證最中心 0 ~ 0.12 完全看穿中空)
    const clearRingGeo = new THREE.RingGeometry(0.12, 0.24, 48);
    const clearRing = new THREE.Mesh(clearRingGeo, acrylicMat);
    discGroup.add(clearRing);

    // 3. 前掀蓋 (Front Hinged Lid) - 鉸鏈軸置於左側 x = -1.42
    const lidHinge = new THREE.Group();
    lidHinge.position.set(-1.42, 0, 0.04);
    mainGroup.add(lidHinge);

    // 前透明外殼
    const frontCoverGeo = new THREE.BoxGeometry(2.84, 2.5, 0.06);
    const frontCover = new THREE.Mesh(frontCoverGeo, acrylicMat);
    frontCover.position.set(1.42, 0, 0.03);
    lidHinge.add(frontCover);

    // 封面歌詞本 (Front Booklet)
    const coverPaperGeo = new THREE.PlaneGeometry(2.76, 2.44);
    const coverPaperMat = new THREE.MeshStandardMaterial({
      map: coverTex,
      roughness: 0.5,
      metalness: 0.1
    });
    const coverPaper = new THREE.Mesh(coverPaperGeo, coverPaperMat);
    coverPaper.position.set(1.42, 0, 0.005);
    lidHinge.add(coverPaper);

    // 前蓋內頁歌詞 (打開可見反面)
    const innerPaperGeo = new THREE.PlaneGeometry(2.76, 2.44);
    const innerPaperMat = new THREE.MeshStandardMaterial({
      map: backTex,
      roughness: 0.5,
      side: THREE.BackSide
    });
    const innerPaper = new THREE.Mesh(innerPaperGeo, innerPaperMat);
    innerPaper.position.set(1.42, 0, 0.004);
    lidHinge.add(innerPaper);

    // 初始狀態：展開至 125 度供檢視內部
    let targetLidAngle = -Math.PI * 0.7; // 開啟
    let isCoverOpen = true;
    let isPlaying = false;
    let isEjected = false;
    let autoSpin = false;
    let targetDiscZ = 0.07;
    let targetDiscY = 0.0;

    // 按鈕綁定
    const btnToggleCover = document.getElementById('btnToggleCover');
    btnToggleCover.addEventListener('click', () => {
      isCoverOpen = !isCoverOpen;
      targetLidAngle = isCoverOpen ? -Math.PI * 0.7 : 0.0;
      btnToggleCover.textContent = isCoverOpen ? '📂 關閉 CD 盒' : '📖 打開 CD 盒';
      btnToggleCover.classList.toggle('active', isCoverOpen);
    });

    const btnPlay = document.getElementById('btnPlay');
    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.textContent = isPlaying ? '⏸ 暫停' : '▶ 播放旋轉';
      btnPlay.classList.toggle('active', isPlaying);
    });

    const btnEject = document.getElementById('btnEject');
    btnEject.addEventListener('click', () => {
      isEjected = !isEjected;
      if (isEjected) {
        if (!isCoverOpen) {
          isCoverOpen = true;
          targetLidAngle = -Math.PI * 0.7;
          btnToggleCover.textContent = '📂 關閉 CD 盒';
        }
        targetDiscZ = 0.55;
        targetDiscY = 0.6;
      } else {
        targetDiscZ = 0.07;
        targetDiscY = 0.0;
      }
      btnEject.textContent = isEjected ? '📥 扣回光碟' : '⏏ 取出光碟';
      btnEject.classList.toggle('active', isEjected);
    });

    const btnAutoSpin = document.getElementById('btnAutoSpin');
    btnAutoSpin.addEventListener('click', () => {
      autoSpin = !autoSpin;
      btnAutoSpin.classList.toggle('active', autoSpin);
    });

    // 循環渲染
    function animate() {
      requestAnimationFrame(animate);

      // 鉸鏈平滑阻尼旋轉
      lidHinge.rotation.y += (targetLidAngle - lidHinge.rotation.y) * 0.1;

      // 光碟取出平滑動畫
      discGroup.position.z += (targetDiscZ - discGroup.position.z) * 0.12;
      discGroup.position.y += (targetDiscY - discGroup.position.y) * 0.12;

      // 播放旋轉
      if (isPlaying) {
        discMesh.rotation.z -= 0.035;
      }

      // 360 度自動巡覽
      if (autoSpin) {
        mainGroup.rotation.y += 0.01;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
